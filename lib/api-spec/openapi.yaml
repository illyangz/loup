openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Loup — household services marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Home screen summary
  - name: catalog
    description: Categories and providers
  - name: bookings
    description: Booking engine, tracking, and chat
  - name: household
    description: Household members and activity
  - name: billing
    description: Consolidated bill and payments
  - name: pack
    description: Household thread and service requests
  - name: push
    description: Web Push notification subscriptions
  - name: openai
    description: OpenAI AI chat and benefit optimisation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [home]
      summary: Home screen summary for the current member
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List service categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /providers:
    get:
      operationId: listProviders
      tags: [catalog]
      summary: List providers with optional filters
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category slug
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Free-text search over provider name and tagline
        - name: availableNow
          in: query
          required: false
          schema:
            type: boolean
          description: Only providers available right now
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
  /providers/{id}:
    get:
      operationId: getProvider
      tags: [catalog]
      summary: Provider profile with services
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /providers/{id}/reviews:
    get:
      operationId: listProviderReviews
      tags: [catalog]
      summary: Reviews for a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
  /household:
    get:
      operationId: getHousehold
      tags: [household]
      summary: Household profile with members
      responses:
        "200":
          description: Household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
  /household/activity:
    get:
      operationId: listHouseholdActivity
      tags: [household]
      summary: Recent household activity feed
      responses:
        "200":
          description: Activity items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /addresses:
    get:
      operationId: listAddresses
      tags: [household]
      summary: Saved household addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List household bookings
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [active, upcoming, past, all]
          description: Filter bookings by lifecycle scope (default all)
      responses:
        "200":
          description: Bookings, soonest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Booking detail with status timeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Reschedule or cancel a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /bookings/{id}/advance:
    post:
      operationId: advanceBooking
      tags: [bookings]
      summary: Advance a live booking to its next status (demo control)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking after advancing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetail"
        "400":
          description: Booking cannot advance further
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /bookings/{id}/messages:
    get:
      operationId: listBookingMessages
      tags: [bookings]
      summary: Booking-scoped chat messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendBookingMessage
      tags: [bookings]
      summary: Send a chat message on a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /reviews:
    post:
      operationId: createReview
      tags: [catalog]
      summary: Rate and review a completed booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /pack/messages:
    get:
      operationId: listPackMessages
      tags: [pack]
      summary: Household thread messages, oldest first (marks thread read)
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackMessage"
    post:
      operationId: sendPackMessage
      tags: [pack]
      summary: Post a message to the household thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackMessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /pack/requests:
    get:
      operationId: listServiceRequests
      tags: [pack]
      summary: Service requests from household members, newest first
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
    post:
      operationId: createServiceRequest
      tags: [pack]
      summary: Request a service for head-of-household approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /pack/requests/{id}/approve:
    post:
      operationId: approveServiceRequest
      tags: [pack]
      summary: Approve a pending request and create the booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request after approval, with the created booking id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /pack/requests/{id}/decline:
    post:
      operationId: declineServiceRequest
      tags: [pack]
      summary: Decline a pending request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request after declining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Request is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [push]
      summary: VAPID public key for Web Push subscription
      responses:
        "200":
          description: Public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
  /push/subscriptions:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register a Web Push subscription for the current member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /push/subscriptions/remove:
    post:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove a Web Push subscription by endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeInput"
      responses:
        "200":
          description: Subscription removed (or was not present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /billing/statement:
    get:
      operationId: getBillingStatement
      tags: [billing]
      summary: Current consolidated household bill
      responses:
        "200":
          description: Current statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillStatement"
  /billing/methods:
    get:
      operationId: listPaymentMethods
      tags: [billing]
      summary: Household payment methods
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
  /billing/pay:
    post:
      operationId: payBillingStatement
      tags: [billing]
      summary: Settle the current consolidated bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Statement after payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillStatement"
        "400":
          description: Nothing to pay or invalid method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /billing/history:
    get:
      operationId: listBillingHistory
      tags: [billing]
      summary: Past consolidated statements
      responses:
        "200":
          description: Statement summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillStatementSummary"
  /v1/demo/login:
    post:
      operationId: demoLogin
      tags: [platform]
      summary: Sign into a simulated demo workspace and receive a signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLogin"
      responses:
        "200":
          description: Signed demo token + resolved principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResult"
        "400":
          description: Invalid role or demo data not seeded
  /v1/demo/roles:
    get:
      operationId: listDemoRoles
      tags: [platform]
      summary: Available simulated demo roles
      responses:
        "200":
          description: Demo role choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoRole"
  /v1/employee/overview:
    get:
      operationId: getEmployeeOverview
      tags: [platform]
      summary: Employee-facing allowance and life administration overview
      responses:
        "200":
          description: Employee overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeOverview"
  /v1/employee/allocation:
    get:
      operationId: getEmployeeAllocation
      tags: [platform]
      summary: Get the employee's current category allocation preferences
      responses:
        "200":
          description: Current allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAllocation"
    patch:
      operationId: saveEmployeeAllocation
      tags: [platform]
      summary: Save (upsert) the employee's category allocation preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAllocationInput"
      responses:
        "200":
          description: Saved allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAllocation"
  /v1/employee/checkout-preview:
    get:
      operationId: getCheckoutPreview
      tags: [platform]
      summary: Calculate split-payment breakdown for a given service
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Checkout preview with split-payment calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPreview"
  /v1/employee/issues:
    post:
      operationId: createSupportIssue
      tags: [platform]
      summary: Submit a support issue for a booking or general query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportIssueInput"
      responses:
        "201":
          description: Issue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportIssue"
  /v1/employer/overview:
    get:
      operationId: getEmployerOverview
      tags: [platform]
      summary: Aggregate employer benefit overview
      responses:
        "200":
          description: Employer overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerOverview"
  /v1/employer/employees:
    get:
      operationId: listEmployerEmployees
      tags: [platform]
      summary: Employer-safe employee roster
      responses:
        "200":
          description: Employee roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployerEmployee"
    post:
      operationId: importEmployerEmployees
      tags: [platform]
      summary: Simulate a CSV employee roster import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /v1/employer/utilization:
    get:
      operationId: getEmployerUtilization
      tags: [platform]
      summary: Aggregate employer utilization metrics
      responses:
        "200":
          description: Aggregate utilization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilizationReport"
  /v1/employer/integrations:
    get:
      operationId: getEmployerIntegrations
      tags: [platform]
      summary: Simulated SSO and embedded widget integration details
      responses:
        "200":
          description: Integration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDetails"
  /v1/employer/campus-breakdown:
    get:
      operationId: getEmployerCampusBreakdown
      tags: [platform]
      summary: Per-campus utilization breakdown with privacy guards (groups < 5 suppressed)
      responses:
        "200":
          description: Campus breakdowns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusBreakdown"
  /v1/employer/employees/{id}:
    patch:
      operationId: updateEmployerEmployee
      tags: [platform]
      summary: Update an employee tier, eligibility, campus, or department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateInput"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerEmployee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/employer/employees/add:
    post:
      operationId: addEmployerEmployee
      tags: [platform]
      summary: Manually add an employee to the roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerEmployee"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/employer/benefit-plans:
    get:
      operationId: listBenefitPlans
      tags: [platform]
      summary: List benefit plans for the institution with tiers and live cost summary
      responses:
        "200":
          description: Benefit plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenefitPlanSummary"
    post:
      operationId: createBenefitPlan
      tags: [platform]
      summary: Create a new benefit plan with tiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitPlanInput"
      responses:
        "201":
          description: Created benefit plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitPlanSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/vendor/today:
    get:
      operationId: getVendorToday
      tags: [platform]
      summary: Vendor operational day view
      responses:
        "200":
          description: Vendor day view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorToday"
  /v1/vendor/forecast:
    get:
      operationId: getVendorForecast
      tags: [platform]
      summary: Simulated vendor demand forecast
      responses:
        "200":
          description: Demand forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastReport"
  /v1/vendor/performance:
    get:
      operationId: getVendorPerformance
      tags: [platform]
      summary: Vendor-owned performance metrics
      responses:
        "200":
          description: Vendor performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPerformance"
  /v1/provider/dashboard:
    get:
      operationId: getProviderDashboard
      tags: [platform]
      summary: Provider dashboard KPIs (real DB data for demo provider)
      responses:
        "200":
          description: Provider dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDashboard"
  /v1/provider/orders:
    get:
      operationId: listProviderOrders
      tags: [platform]
      summary: List orders for the demo provider, filtered by scope
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, upcoming, completed, rejected, all]
      responses:
        "200":
          description: Provider orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderOrder"
  /v1/provider/orders/{id}/accept:
    post:
      operationId: acceptProviderOrder
      tags: [platform]
      summary: Accept a pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOrder"
        "400":
          description: Order cannot be accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/orders/{id}/reject:
    post:
      operationId: rejectProviderOrder
      tags: [platform]
      summary: Reject a pending order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderOrderActionInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOrder"
        "400":
          description: Order cannot be rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/orders/{id}/advance:
    post:
      operationId: advanceProviderOrder
      tags: [platform]
      summary: Advance a provider order to its next lifecycle status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOrder"
        "400":
          description: Order cannot advance further
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/orders/{id}/report-issue:
    post:
      operationId: reportProviderOrderIssue
      tags: [platform]
      summary: Flag a booking as disputed and open a support incident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderOrderActionInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderOrder"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/availability:
    get:
      operationId: listProviderAvailability
      tags: [platform]
      summary: List provider availability slots
      responses:
        "200":
          description: Availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderAvailabilitySlot"
    post:
      operationId: createProviderAvailability
      tags: [platform]
      summary: Add a new availability slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAvailabilityInput"
      responses:
        "201":
          description: Created slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAvailabilitySlot"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/availability/{id}:
    delete:
      operationId: deleteProviderAvailability
      tags: [platform]
      summary: Remove an availability slot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /v1/provider/analytics:
    get:
      operationId: getProviderAnalytics
      tags: [platform]
      summary: Provider analytics — demand, KPIs, and operational demand forecast
      responses:
        "200":
          description: Provider analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAnalytics"
  /v1/operations/overview:
    get:
      operationId: getOperationsOverview
      tags: [platform]
      summary: Operations control tower overview
      responses:
        "200":
          description: Operations overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"
  /v1/operations/service-fit:
    get:
      operationId: listServiceFitEvaluations
      tags: [platform]
      summary: Internal service-fit evaluation
      responses:
        "200":
          description: Service-fit evaluations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceFitEvaluation"
  /v1/operations/audit:
    get:
      operationId: listAuditEvents
      tags: [platform]
      summary: Immutable operational audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /v1/admin/incidents:
    get:
      operationId: listAdminIncidents
      tags: [platform]
      summary: List support incidents (optionally filtered by status)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, investigating, resolved, closed]
          description: Filter by incident status (default all)
      responses:
        "200":
          description: Incidents, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminIncident"
  /v1/admin/incidents/{id}:
    patch:
      operationId: resolveAdminIncident
      tags: [platform]
      summary: Update the status of a support incident (resolve or close)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIncidentUpdate"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIncident"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and receive a streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
components:
  schemas:
    DemoRole:
      type: object
      required: [role, label, description, href]
      properties:
        role:
          type: string
          enum: [employee, institution, provider, admin]
        label:
          type: string
        description:
          type: string
        href:
          type: string
    DemoLogin:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [employee, institution, provider, admin]
        slug:
          type: string
          description: Optional tenant slug for the institution role (meridian, al-noor). Defaults to meridian.
    DemoLoginPrincipal:
      type: object
      required: [role, name]
      properties:
        role:
          type: string
          enum: [employee, institution, provider, admin]
        name:
          type: string
        employerId:
          type: integer
        institutionId:
          type: integer
        providerId:
          type: integer
        memberId:
          type: integer
        employeeId:
          type: integer
        label:
          type: string
    DemoLoginResult:
      type: object
      required: [token, expiresInSeconds, principal]
      properties:
        token:
          type: string
        expiresInSeconds:
          type: integer
        principal:
          $ref: "#/components/schemas/DemoLoginPrincipal"
    EmployeeOverview:
      type: object
      required:
        - employeeName
        - employerName
        - institutionName
        - campusName
        - benefitTierName
        - benefitTierAllowance
        - allowance
        - upcomingBooking
        - metrics
        - activeCategories
        - routines
      properties:
        employeeName: { type: string }
        employerName: { type: string }
        institutionName: { type: string }
        campusName: { type: string }
        benefitTierName: { type: string }
        benefitTierAllowance: { type: number }
        allowance:
          $ref: "#/components/schemas/AllowanceSummary"
        upcomingBooking:
          oneOf:
            - $ref: "#/components/schemas/Booking"
            - type: "null"
        metrics:
          $ref: "#/components/schemas/EmployeeMetrics"
        activeCategories:
          type: array
          items:
            $ref: "#/components/schemas/ActiveService"
        routines:
          type: array
          items:
            $ref: "#/components/schemas/Routine"
    AllowanceSummary:
      type: object
      required: [authorized, reserved, redeemed, available, renewalDate, expiration]
      properties:
        authorized: { type: number }
        reserved: { type: number }
        redeemed: { type: number }
        available: { type: number }
        renewalDate: { type: string }
        expiration: { type: string }
    EmployeeMetrics:
      type: object
      required: [employerSupport, corporateSavings, servicesCompleted, estimatedTimeSavedMinutes, householdAllocations]
      properties:
        employerSupport: { type: number }
        corporateSavings: { type: number }
        servicesCompleted: { type: integer }
        estimatedTimeSavedMinutes: { type: integer }
        householdAllocations: { type: number }
    ActiveService:
      type: object
      required: [slug, name, description, dimension, publicPrice, corporatePrice, employerContribution, employeeCopayment, durationMinutes, providerVerification]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        dimension: { type: string }
        publicPrice: { type: number }
        corporatePrice: { type: number }
        employerContribution: { type: number }
        employeeCopayment: { type: number }
        durationMinutes: { type: integer }
        providerVerification: { type: string }
    Routine:
      type: object
      required: [id, label, categorySlug, frequency, preferredDay, preferredTime, maxCopayment, manualConfirmation, status]
      properties:
        id: { type: integer }
        label: { type: string }
        categorySlug: { type: string }
        frequency: { type: string }
        preferredDay: { type: string }
        preferredTime: { type: string }
        maxCopayment: { type: number }
        manualConfirmation: { type: boolean }
        status: { type: string }
    EmployerOverview:
      type: object
      required:
        - employerName
        - eligibleEmployees
        - activatedEmployees
        - authorizedMaximum
        - redeemedAllowances
        - reservedAllowances
        - forecastRedemptions
        - invoiceEstimate
        - completionRate
        - satisfaction
        - platformFeeRatePct
        - perEmployeeMonthlyFee
        - estimatedMonthlyPlatformRevenue
      properties:
        employerName: { type: string }
        eligibleEmployees: { type: integer }
        activatedEmployees: { type: integer }
        authorizedMaximum: { type: number }
        redeemedAllowances: { type: number }
        reservedAllowances: { type: number }
        forecastRedemptions: { type: number }
        invoiceEstimate: { type: number }
        completionRate: { type: number }
        satisfaction: { type: number }
        platformFeeRatePct: { type: number }
        perEmployeeMonthlyFee: { type: number }
        estimatedMonthlyPlatformRevenue: { type: number }
    EmployerEmployee:
      type: object
      required: [id, externalEmployeeId, name, workEmail, department, benefitTier, eligibilityStatus, householdEligible]
      properties:
        id: { type: integer }
        externalEmployeeId: { type: string }
        name: { type: string }
        workEmail: { type: string }
        department: { type: string }
        benefitTier: { type: string }
        eligibilityStatus: { type: string }
        householdEligible: { type: boolean }
        campusId: { type: integer }
        campusName: { type: string }
        tierId: { type: integer }
        tierName: { type: string }
        startDate: { type: string }
        endDate: { type: string }
    EmployeeImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          minLength: 1
    ImportResult:
      type: object
      required: [status, imported, skipped, message]
      properties:
        status: { type: string }
        imported: { type: integer }
        skipped: { type: integer }
        message: { type: string }
    UtilizationReport:
      type: object
      required: [activationRate, redemptionRate, repeatUsageRate, averageSupportPerActiveEmployee, categoryUtilization, corporateSavings, estimatedTimeSavedMinutes, satisfaction, completionRate, serviceRecoveryRate]
      properties:
        activationRate: { type: number }
        redemptionRate: { type: number }
        repeatUsageRate: { type: number }
        averageSupportPerActiveEmployee: { type: number }
        categoryUtilization:
          type: array
          items:
            $ref: "#/components/schemas/CategoryUtilization"
        corporateSavings: { type: number }
        estimatedTimeSavedMinutes: { type: integer }
        satisfaction: { type: number }
        completionRate: { type: number }
        serviceRecoveryRate: { type: number }
    CategoryUtilization:
      type: object
      required: [category, bookings, share]
      properties:
        category: { type: string }
        bookings: { type: integer }
        share: { type: number }
    IntegrationDetails:
      type: object
      required: [ssoLabel, ssoUrl, widgetScript, widgetSnippet, apiMode]
      properties:
        ssoLabel: { type: string }
        ssoUrl: { type: string }
        widgetScript: { type: string }
        widgetSnippet: { type: string }
        apiMode: { type: string }
    VendorToday:
      type: object
      required: [vendorName, assignedBookings, awaitingAcceptance, availableCapacity, capacityWarnings, lateArrivalWarnings, serviceRecoveryActions]
      properties:
        vendorName: { type: string }
        assignedBookings:
          type: array
          items:
            $ref: "#/components/schemas/VendorBooking"
        awaitingAcceptance: { type: integer }
        availableCapacity: { type: integer }
        capacityWarnings: { type: integer }
        lateArrivalWarnings: { type: integer }
        serviceRecoveryActions: { type: integer }
    VendorBooking:
      type: object
      required: [id, category, zone, scheduledAt, status, operationalRequirement]
      properties:
        id: { type: integer }
        category: { type: string }
        zone: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { type: string }
        operationalRequirement: { type: string }
    ForecastReport:
      type: object
      required: [updatedAt, confidence, windows]
      properties:
        updatedAt: { type: string, format: date-time }
        confidence: { type: number }
        windows:
          type: array
          items:
            $ref: "#/components/schemas/ForecastWindow"
    ForecastWindow:
      type: object
      required: [label, category, zone, expectedBookings, low, high, capacityGap, recommendation]
      properties:
        label: { type: string }
        category: { type: string }
        zone: { type: string }
        expectedBookings: { type: integer }
        low: { type: integer }
        high: { type: integer }
        capacityGap: { type: integer }
        recommendation: { type: string }
    VendorPerformance:
      type: object
      required: [vendorName, status, completionRate, onTimeRate, cancellationRate, averageRating, complaintRate, serviceRecoveryRate, capacityAccuracy]
      properties:
        vendorName: { type: string }
        status: { type: string }
        completionRate: { type: number }
        onTimeRate: { type: number }
        cancellationRate: { type: number }
        averageRating: { type: number }
        complaintRate: { type: number }
        serviceRecoveryRate: { type: number }
        capacityAccuracy: { type: number }
    ProviderOrder:
      type: object
      required: [id, serviceName, categoryName, memberName, addressLabel, zone, scheduledAt, status, priceEstimate, instructions, etaMinutes, createdAt]
      properties:
        id: { type: integer }
        serviceName: { type: string }
        categoryName: { type: string }
        memberName: { type: string }
        addressLabel: { type: string }
        zone: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { type: string }
        priceEstimate: { type: number }
        instructions: { type: ["string", "null"] }
        etaMinutes: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    ProviderOrderActionInput:
      type: object
      properties:
        reason: { type: string }
        description: { type: string }
    ProviderDashboard:
      type: object
      required: [providerName, pendingCount, acceptedCount, confirmedCount, activeCount, completedThisMonth, cancelledThisMonth, estimatedSettlement, averageRating, fulfilmentRate, cancellationRate, slaRate]
      properties:
        providerName: { type: string }
        pendingCount: { type: integer }
        acceptedCount: { type: integer }
        confirmedCount: { type: integer }
        activeCount: { type: integer }
        completedThisMonth: { type: integer }
        cancelledThisMonth: { type: integer }
        estimatedSettlement: { type: number }
        averageRating: { type: number }
        fulfilmentRate: { type: number }
        cancellationRate: { type: number }
        slaRate: { type: number }
    ProviderAvailabilitySlot:
      type: object
      required: [id, dayOfWeek, startTime, endTime, zones, maxCapacity, active]
      properties:
        id: { type: integer }
        dayOfWeek: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        serviceId: { type: integer }
        zones:
          type: array
          items: { type: string }
        maxCapacity: { type: integer }
        active: { type: boolean }
    ProviderAvailabilityInput:
      type: object
      required: [dayOfWeek, startTime, endTime, zones, maxCapacity]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string }
        endTime: { type: string }
        serviceId: { type: integer }
        zones:
          type: array
          items: { type: string }
        maxCapacity: { type: integer }
    ProviderAnalytics:
      type: object
      required: [demandByService, demandByDay, demandByZone, completionRate, averageRating, repeatBookingRate, capacityUtilization, forecast]
      properties:
        demandByService:
          type: array
          items:
            type: object
            required: [serviceName, bookings, revenue]
            properties:
              serviceName: { type: string }
              bookings: { type: integer }
              revenue: { type: number }
        demandByDay:
          type: array
          items:
            type: object
            required: [dayLabel, bookings]
            properties:
              dayLabel: { type: string }
              bookings: { type: integer }
        demandByZone:
          type: array
          items:
            type: object
            required: [zone, bookings]
            properties:
              zone: { type: string }
              bookings: { type: integer }
        completionRate: { type: number }
        averageRating: { type: number }
        repeatBookingRate: { type: number }
        capacityUtilization: { type: number }
        forecast:
          type: object
          required: [estimate, confidence, method, updatedAt]
          properties:
            estimate: { type: integer }
            confidence: { type: number }
            method: { type: string }
            updatedAt: { type: string, format: date-time }
    OperationsOverview:
      type: object
      required: [forecastBookings, confirmedBookings, unfulfilledDemand, capacityShortages, highRiskBookings, providerIncidents, transactionVolume, spendingAlerts, matching, methodology]
      properties:
        forecastBookings: { type: integer }
        confirmedBookings: { type: integer }
        unfulfilledDemand: { type: integer }
        capacityShortages: { type: integer }
        highRiskBookings: { type: integer }
        providerIncidents: { type: integer }
        transactionVolume: { type: number }
        spendingAlerts: { type: integer }
        matching:
          type: array
          items:
            $ref: "#/components/schemas/MatchDecision"
        methodology: { type: string }
    MatchDecision:
      type: object
      required: [bookingId, category, zone, selectedProvider, score, drivers, manualOverride]
      properties:
        bookingId: { type: integer }
        category: { type: string }
        zone: { type: string }
        selectedProvider: { type: string }
        score: { type: number }
        drivers:
          type: array
          items: { type: string }
        manualOverride: { type: boolean }
    ServiceFitEvaluation:
      type: object
      required: [service, status, dimensions, problemFrequency, timeSaved, employerRelevance, repeatPotential, standardization, providerCoverage, regulatoryComplexity, overallFit]
      properties:
        service: { type: string }
        status: { type: string }
        dimensions:
          type: array
          items: { type: string }
        problemFrequency: { type: integer }
        timeSaved: { type: integer }
        employerRelevance: { type: integer }
        repeatPotential: { type: integer }
        standardization: { type: integer }
        providerCoverage: { type: integer }
        regulatoryComplexity: { type: integer }
        overallFit: { type: integer }
    AuditEvent:
      type: object
      required: [id, actorRole, action, entityType, entityId, createdAt]
      properties:
        id: { type: integer }
        actorRole: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        createdAt: { type: string, format: date-time }
    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          minLength: 1
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              minLength: 1
            auth:
              type: string
              minLength: 1
    PushUnsubscribeInput:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          minLength: 1
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HomeSummary:
      type: object
      properties:
        memberName:
          type: string
        householdName:
          type: string
        activeBooking:
          oneOf:
            - $ref: "#/components/schemas/Booking"
            - type: "null"
        nextBooking:
          oneOf:
            - $ref: "#/components/schemas/Booking"
            - type: "null"
        upcomingCount:
          type: integer
        openBillTotal:
          type: number
        monthToDateSpend:
          type: number
        memberCount:
          type: integer
        isHeadOfHousehold:
          type: boolean
          description: Whether the current member can approve or decline service requests
        packUnreadCount:
          type: integer
        recentPackMessages:
          type: array
          description: Latest household thread messages, newest first
          items:
            $ref: "#/components/schemas/PackMessage"
        pendingRequests:
          type: array
          description: Pending service requests awaiting a decision
          items:
            $ref: "#/components/schemas/ServiceRequest"
      required:
        - memberName
        - householdName
        - activeBooking
        - nextBooking
        - upcomingCount
        - openBillTotal
        - monthToDateSpend
        - memberCount
        - isHeadOfHousehold
        - packUnreadCount
        - recentPackMessages
        - pendingRequests
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
        icon:
          type: string
          description: Lucide icon name, e.g. Sparkles, AirVent, Wrench
        providerCount:
          type: integer
        startingPrice:
          type: number
      required:
        - id
        - name
        - slug
        - tagline
        - icon
        - providerCount
        - startingPrice
    Provider:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        categorySlug:
          type: string
        categoryName:
          type: string
