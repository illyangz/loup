services:
  - type: web
    name: loup-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/v1/demo/roles
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # DATABASE_URL: paste your Neon connection string here manually in the
      # Render dashboard (Environment tab). Render's own Postgres wants a
      # card; Neon's free tier doesn't, so DB lives there instead — no
      # fromDatabase/databases: block here on purpose.
      - key: LOUP_DEMO_JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
