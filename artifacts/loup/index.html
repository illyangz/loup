<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Loup</title>
    <meta name="description" content="Loup — the household concierge for Dubai families. Summon vetted home professionals, follow live visits on a shared family calendar, and settle one monthly bill." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Loup — Household Concierge" />
    <meta property="og:description" content="Summon vetted home professionals, follow live visits on a shared family calendar, and settle one monthly bill." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loup — Household Concierge" />
    <meta name="twitter:description" content="Summon vetted home professionals, follow live visits on a shared family calendar, and settle one monthly bill." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Loup" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function () {
        // Dark is the default (see index.css :root); this only avoids a
        // flash of dark before hydration for users who chose light mode.
        try {
          if (localStorage.getItem("loup-app-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
